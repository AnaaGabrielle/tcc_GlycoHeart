<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GlycoHeart | Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                💙
            </div>

            <h1>GlycoHeart</h1>

            <p class="subtitulo">
                Monitoramento inteligente de saúde
            </p>

            <form id="loginForm">

                <div class="campo">

                    <label for="usuario">
                        Usuário
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        placeholder="Digite seu usuário"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>

                <button type="submit" class="btn-login">
                    Entrar
                </button>

                <p id="mensagem"></p>

            </form>

            <div class="demo">

                <strong>Acesso de demonstração</strong>

                <span>
                    Usuário: admin
                </span>

                <span>
                    Senha: 1234
                </span>

            </div>

        </div>

    </div>

    <script src="login.js"></script>

</body>

</html>
